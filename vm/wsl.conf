# ============================================================================
# SHISHYA — the sandbox's WSL settings, installed as /etc/wsl.conf.
#
# This file and vm/fstab together are what vm/lima.yaml's mount list used to
# be: the permission boundary. Not a policy we enforce in code — the clone
# cannot reach anything that is not mounted.
#
# WSL's defaults are the opposite of a sandbox. Out of the box every Windows
# drive is mounted at /mnt/c, /mnt/d, …, read-write, and any process in the
# guest can start a Windows program (cmd.exe, powershell.exe) as you. Both are
# switched off here, before the sandbox has ever booted as itself —
# host/vm.py writes this file into the fresh image and restarts it before any
# of our code runs inside.
#
# Change it here, then recreate the sandbox. Editing /etc/wsl.conf inside a
# running one works too, but is lost on rollback and is not in git.
# ============================================================================

[boot]
# The desktop, the display, the egress lock — all systemd units.
systemd = true

[automount]
# No C:\ in the sandbox. The two folders the clone may see are in /etc/fstab,
# and nothing else on this computer exists as far as it knows.
enabled = false
mountFsTab = true

[interop]
# No launching Windows programs from inside. With this on, `cmd.exe /c …`
# from the guest runs on Windows as the person logged in — a way out of the
# box that does not touch the network or the mounts at all.
enabled = false
appendWindowsPath = false

[user]
# The host side drives the guest as root (the clone itself never is).
default = root

[network]
hostname = shishya
generateHosts = true
generateResolvConf = true
