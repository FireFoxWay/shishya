<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="description" content="Tidefruit — a 2D multiplayer grind across four seas. 3,000 levels, 27 fruits, bosses, sea beasts and PvP.">
  <title>Tidefruit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%23ff6d00'/%3E%3Cpath d='M20 32a6 6 0 1 1 8 4M38 30a5 5 0 1 1 6 6M28 46a6 6 0 1 1 8 2' stroke='%23ffd54f' stroke-width='3' fill='none'/%3E%3Crect x='30' y='6' width='4' height='10' fill='%235d4037'/%3E%3Cellipse cx='41' cy='10' rx='9' ry='4' fill='%2343a047'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Login -->
  <div id="login">
    <div class="login-card">
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="36" r="24" fill="#ff6d00"/><path d="M20 32a6 6 0 1 1 8 4M38 30a5 5 0 1 1 6 6M28 46a6 6 0 1 1 8 2" stroke="#ffd54f" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="30" y="6" width="4" height="10" fill="#5d4037"/><ellipse cx="41" cy="10" rx="9" ry="4" fill="#43a047" transform="rotate(-22 41 10)"/></svg>
      </div>
      <h1>TIDEFRUIT</h1>
      <p class="tagline">Four seas · 3,000 levels · 27 fruits · real-time PvP</p>
      <input id="nameInput" maxlength="16" placeholder="Captain name" autocomplete="off" spellcheck="false">
      <div class="teams">
        <button class="team pirate" data-team="pirate">☠ Pirates</button>
        <button class="team marine" data-team="marine">⚓ Marines</button>
      </div>
      <button id="playBtn" class="play">Set sail</button>
      <p id="loginErr"></p>
      <p class="online"><span id="onlineCount">…</span> sailors online</p>
      <p class="fine">Your progress is saved on the server under this name, tied to this browser.</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topleft">
      <div class="who"><span class="lvbadge">Lv <b id="lvl">1</b></span> <b id="pname"></b></div>
      <div class="loc"><span id="locSea"></span> · <span id="locIsle"></span> <span id="safeTag" class="tag safe hidden">SAFE ZONE</span></div>
      <div class="money"><span class="beli">$ <b id="beli">0</b></span><span class="frags">◆ <b id="frags">0</b></span></div>
      <div class="bountyline"><span id="bountyLabel">Bounty</span> <b id="bounty">0</b></div>
      <div id="buffs"></div>
    </div>

    <div id="topright">
      <canvas id="minimap" width="180" height="180"></canvas>
      <div class="btnrow">
        <button data-open="stats">Stats <kbd>K</kbd><em id="ptsBadge" class="hidden"></em></button>
        <button data-open="bag">Bag <kbd>I</kbd></button>
        <button data-open="map">Map <kbd>M</kbd></button>
        <button data-open="top">Top <kbd>Tab</kbd></button>
        <button data-open="codes">Codes</button>
        <button data-open="help">Help <kbd>H</kbd></button>
        <button id="pvpBtn">PvP: Off</button>
      </div>
      <div id="ping"></div>
    </div>

    <div id="bossbar" class="hidden"><div id="bossName"></div><div class="bbar"><i id="bossFill"></i><span id="bossHp"></span></div></div>
    <div id="quest" class="hidden"></div>
    <div id="toasts"></div>
    <div id="lvlup" class="hidden"></div>
    <div id="banner" class="hidden"></div>

    <div id="chat">
      <div id="chatLog"></div>
      <input id="chatInput" maxlength="140" placeholder="Press Enter to chat" autocomplete="off">
    </div>

    <div id="bottom">
      <div id="prompt" class="hidden"></div>
      <div id="skills"></div>
      <div class="bars">
        <div class="bar hp"><i id="hpFill"></i><span id="hpText"></span></div>
        <div class="bar en"><i id="enFill"></i><span id="enText"></span></div>
      </div>
      <div class="hotrow"><div id="hotbar"></div><div id="dashCd" class="ready">Dash ready</div></div>
    </div>
    <div id="xpbar"><i id="xpFill"></i><span id="xpText"></span></div>

    <div id="death" class="hidden"><h1>Defeated</h1><p id="deathBy"></p><p id="deathTimer"></p></div>

    <div id="panel" class="hidden">
      <div class="panel-head"><h2 id="panelTitle"></h2><button id="panelClose" aria-label="Close">✕</button></div>
      <div id="panelBody"></div>
    </div>

    <div id="touch" class="hidden">
      <div id="joy"><div id="joyKnob"></div></div>
      <button id="tAttack">⚔</button>
      <button id="tDash">»</button>
      <button id="tInteract" class="hidden">E</button>
      <button id="tChat">💬</button>
    </div>
  </div>

  <script src="shared/tf.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
